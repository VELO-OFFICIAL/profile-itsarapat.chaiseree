<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'IBM Plex Sans Thai','IBM Plex Sans',sans-serif">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b34a17" stop-opacity=".16"/>
      <stop offset="1" stop-color="#b34a17" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#141210" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#faf7f2"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <rect x="72" y="70" width="46" height="46" rx="11" fill="#b34a17"/>
  <text x="95" y="102" font-family="monospace" font-size="20" font-weight="700" fill="#faf7f2" text-anchor="middle">IC</text>
  <text x="134" y="101" font-size="21" font-weight="600" fill="#4b453c">Portfolio</text>

  <text x="72" y="252" font-family="monospace" font-size="19" letter-spacing="3" fill="#b34a17">NAKRIAN · MATHAYOM TON · 2026</text>

  <text x="72" y="330" font-size="76" font-weight="700" fill="#141210" letter-spacing="-2">อิสระพัฒ <tspan fill="#b34a17">ชัยเสรี</tspan></text>

  <text x="72" y="392" font-size="28" fill="#4b453c">นักเรียนที่สร้าง AI Tools ใช้งานได้จริง</text>
  <text x="72" y="434" font-size="22" fill="#8a8377">ทีม AI Skills 8 ตัวสำหรับ Claude · เว็บธุรกิจ Put SSR.SHOP</text>

  <g transform="translate(72,500)">
    <rect width="196" height="60" rx="10" fill="#fff" stroke="#141210" stroke-opacity=".12"/>
    <text x="18" y="27" font-family="monospace" font-size="30" font-weight="700" fill="#141210">8</text>
    <text x="18" y="47" font-size="14" fill="#8a8377">AI Skills</text>

    <rect x="214" width="230" height="60" rx="10" fill="#fff" stroke="#141210" stroke-opacity=".12"/>
    <text x="232" y="27" font-family="monospace" font-size="30" font-weight="700" fill="#141210">1</text>
    <text x="232" y="47" font-size="14" fill="#8a8377">เว็บธุรกิจออนไลน์จริง</text>

    <rect x="458" width="226" height="60" rx="10" fill="#fff" stroke="#141210" stroke-opacity=".12"/>
    <text x="476" y="27" font-family="monospace" font-size="30" font-weight="700" fill="#141210">3</text>
    <text x="476" y="47" font-size="14" fill="#8a8377">ภาษาโปรแกรม</text>
  </g>

  <g transform="translate(772,150)">
    <rect width="356" height="330" rx="14" fill="#17150f"/>
    <rect x="0" y="0" width="356" height="36" rx="14" fill="#221e17"/>
    <rect x="0" y="22" width="356" height="14" fill="#221e17"/>
    <circle cx="24" cy="18" r="5" fill="#e8804a"/>
    <circle cx="42" cy="18" r="5" fill="#ffffff" fill-opacity=".18"/>
    <circle cx="60" cy="18" r="5" fill="#ffffff" fill-opacity=".18"/>
    <text x="90" y="23" font-family="monospace" font-size="13" fill="#8b8579">math-genius.skill</text>

    <text x="26" y="80" font-family="monospace" font-size="13" fill="#8b8579">&gt; solve 2x² − 5x − 3 = 0</text>
    <rect x="26" y="98" width="304" height="96" rx="8" fill="#ffffff" fill-opacity=".05"/>
    <text x="42" y="124" font-family="monospace" font-size="13" fill="#c9c3b6">from sympy import solve</text>
    <text x="42" y="148" font-family="monospace" font-size="13" fill="#c9c3b6">solve(2*x**2-5*x-3, x)</text>
    <text x="42" y="174" font-family="monospace" font-size="13" fill="#8b8579"># → [-1/2, 3]</text>

    <text x="26" y="228" font-size="17" font-weight="700" fill="#ffb488">x = −1/2 หรือ x = 3</text>
    <rect x="26" y="248" width="230" height="30" rx="15" fill="#6fcf97" fill-opacity=".14"/>
    <text x="46" y="268" font-size="14" fill="#6fcf97">✓ ตรวจซ้ำด้วยโค้ดแล้ว</text>
  </g>
</svg>
